zerops:
  - setup: prerender
    build:
      base: go@latest
      buildCommands:
        - go build -o main main.go
      deploy:
        - main
    run:
      base: alpine@latest
      prepareCommands:
        - sudo apk add --update-cache chromium
        - sudo rm -rf /var/cache/apk/* /tmp/*
      ports:
        - port: 8080
          httpSupport: true
      start: ./main
